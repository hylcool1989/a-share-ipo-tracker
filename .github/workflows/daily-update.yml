name: Refresh and publish A-share IPO Tracker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update.py
      - enrich.py
      - market_cap.py
      - dashboard/**
      - requirements.txt
      - .github/workflows/**
  schedule:
    - cron: '30 11 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ipo-tracker-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update data (allow explicitly flagged partial sources)
        id: update
        run: |
          python update.py || {
            if [ ! -s dashboard/ipo_data.json ]; then
              echo "::error::Both IPO sources unavailable; no verified data to publish"
              exit 1
            fi
            echo "::warning::One IPO source failed; published data will show a source-error warning"
          }
      - name: Enrich issuer business and financial data
        run: python -u enrich.py
      - name: Update market capitalization (latest available quotes)
        run: python -u market_cap.py
      - name: Commit snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ dashboard/ipo_data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh IPO database'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
