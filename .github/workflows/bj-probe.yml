name: Probe BJ market capitalization sources
on:
  push:
    branches: [main]
    paths: [tools/bj_probe.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python -u tools/bj_probe.py
