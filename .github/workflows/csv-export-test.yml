name: Verify CSV full export
on:
  push:
    branches: [main]
    paths:
      - dashboard/index.html
      - tests/export.test.cjs
      - .github/workflows/csv-export-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/export.test.cjs
